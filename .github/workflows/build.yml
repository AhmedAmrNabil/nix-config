name: Build packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names (leave empty = build all)"
        type: string
        default: ""
  push:
    paths:
      - 'packages/**'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: cachix/install-nix-action@v31

      - id: set-matrix
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            # Turn "pkg1, pkg2, pkg3" into a JSON array
            packages=$(echo '${{ inputs.packages }}' \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | jq -R . \
              | jq -s -c .)
          elif [ "${{ github.event_name }}" = "push" ]; then
            changed_dirs=$(git diff --name-only HEAD~1 HEAD | grep '^packages/.*\.nix$' | cut -d'/' -f2 | sort -u || true)
            if [ -n "$changed_dirs" ]; then
              packages=$(echo "$changed_dirs" | jq -R . | jq -s -c .)
            else
              packages="[]"
            fi
          else
            packages=$(nix eval --json .#packages.x86_64-linux --apply 'builtins.attrNames')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $packages"
      - name: Fail if nothing selected
        run: |
          if [ '${{ steps.set-matrix.outputs.packages }}' = "[]" ]; then
            echo "::error::No packages selected."
            exit 1
          fi

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }} -L

      - uses: cachix/cachix-action@v17
        with:
          name: ahmed-amr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: result
