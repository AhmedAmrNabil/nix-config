name: Build packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names (leave empty = build all)"
        type: string
        default: ""
  push:
    paths:
      - "packages/**"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
      has_packages: ${{ steps.warn.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - id: set-matrix
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            # Turn "pkg1, pkg2, pkg3" into a JSON array
            packages=$(echo '${{ inputs.packages }}' \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | jq -R . \
              | jq -s -c .)
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -z "$(git cat-file -t "$before" 2>/dev/null)" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              # first push to the branch / before-sha not available — fall back to just this commit
              changed_dirs=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^packages/.*\.nix$' | cut -d'/' -f2 | sort -u || true)
            else
              changed_dirs=$(git diff --name-only "$before" HEAD | grep '^packages/.*\.nix$' | cut -d'/' -f2 | sort -u || true)
            fi
            if [ -n "$changed_dirs" ]; then
              packages=$(echo "$changed_dirs" | jq -R . | jq -s -c .)
            else
              packages="[]"
            fi
          else
            packages=$(nix eval --json .#packages.x86_64-linux --apply 'builtins.attrNames')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $packages"
      - id: warn
        name: Warn if nothing selected
        run: |
          if [ '${{ steps.set-matrix.outputs.packages }}' = "[]" ]; then
            echo "::warning::No Nix package files modified or selected. Skipping build stage."
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    if: needs.discover.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: ahmed-amr
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: result
      - name: Build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }} -L
