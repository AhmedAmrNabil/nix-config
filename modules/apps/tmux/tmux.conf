# ==============================================================================
# TMUX Configuration
# ==============================================================================

# ---------------------------------------------------------
# General Settings
# ---------------------------------------------------------
# Enable 256 color and truecolor support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse mode
set -g mouse on

# Start window and pane numbering at 1 (more natural on keyboards)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reduce escape-time delay for snappy key response
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# ---------------------------------------------------------
# Keybindings
# ---------------------------------------------------------
# Reload config quickly with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Split panes using | and - in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new window in the current working directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---------------------------------------------------------
# Catppuccin Theme Configuration
# ---------------------------------------------------------
# Flavor options: latte, frappe, macchiato, mocha
set -g @catppuccin_flavor 'mocha'

# Window status style: basic, rounded, slanted
set -g @catppuccin_window_status_style "rounded"

# Load Catppuccin plugin (provided via Home Manager module)
run-shell ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

# Status bar layout and modules
set -g status-position top
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
